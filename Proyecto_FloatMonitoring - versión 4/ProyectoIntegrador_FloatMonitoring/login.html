<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Monitoring | Iniciar Sesión</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .login-header {
            background-color: #0d6efd;
            color: white;
            border-radius: 1rem 1rem 0 0;
            padding: 2rem;
            text-align: center;
        }

        .login-header i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="login-header">
            <i class="bi bi-droplet-half"></i>
            <h4 class="mb-0 fw-bold">Float Monitoring</h4>
            <p class="mb-0 opacity-75 small">Sistema de monitoreo de aguas residuales</p>
        </div>
        <div class="card-body p-4">
            <h5 class="mb-4 text-center text-muted">Iniciar Sesión</h5>

            <div id="alerta-error" class="alert alert-danger d-none py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span id="mensaje-error"></span>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario"
                        autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña"
                        autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password" tabindex="-1">
                        <i class="bi bi-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button id="btn-login" class="btn btn-primary w-100 fw-semibold" onclick="iniciarSesion()">
                <span id="btn-texto">Ingresar</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/Js/login.js"></script>
</body>
</html>
